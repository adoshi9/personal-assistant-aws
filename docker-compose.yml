version: '3.8'

services:
  assistant:
    build:
      context: .
      dockerfile: Dockerfile
    image: personal-assistant-aws:latest
    container_name: personal-assistant
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - LOG_LEVEL=INFO
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8000
      # AWS credentials will be loaded from host or IAM role
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_SECRETS_PREFIX=personal-assistant/
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5.0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Optional: mount local code for development
    # volumes:
    #   - ./app:/app/app
    networks:
      - assistant-network

networks:
  assistant-network:
    driver: bridge
